<style>
/* Layout: app da telefono a una colonna, intestazione fissa in alto, barra schede in basso; il terrario è disegnato in sezione su una "scena" chiara */
:root{
  --bg:#EDF1EA; --surface:#FBFCF9; --surface2:#E2E9DF; --fg:#17231B; --muted:#56665B; --line:#CFD9CD;
  --accent:#2D6A47; --accent-ink:#FFFFFF; --accent-soft:#D5E7DA;
  --lemon:#C8941A; --lemon-soft:#F6E9C4;
  --warn:#8E5A0E; --warn-soft:#F6E6C8; --bad:#A33232; --bad-soft:#F6DAD6; --good:#2D6A47; --good-soft:#D5E7DA;
  --scene:#E1EBE6; --scene2:#F4F8F5; --shadow:0 1px 2px rgba(23,35,27,.06),0 4px 14px rgba(23,35,27,.06);
  --f-display:'Bricolage Grotesque','Avenir Next',system-ui,sans-serif;
  --f-body:'Atkinson Hyperlegible',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1510; --surface:#172119; --surface2:#202C23; --fg:#E5EDE6; --muted:#9BAAA0; --line:#2B3A2F;
  --accent:#74C493; --accent-ink:#0E1510; --accent-soft:#1E3828;
  --lemon:#E6BE55; --lemon-soft:#3A3118;
  --warn:#E5AE52; --warn-soft:#3A2E17; --bad:#EC8A82; --bad-soft:#3D1F1D; --good:#74C493; --good-soft:#1E3828;
  --scene:#1B2722; --scene2:#121B16; --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E1510; --surface:#172119; --surface2:#202C23; --fg:#E5EDE6; --muted:#9BAAA0; --line:#2B3A2F;
  --accent:#74C493; --accent-ink:#0E1510; --accent-soft:#1E3828;
  --lemon:#E6BE55; --lemon-soft:#3A3118;
  --warn:#E5AE52; --warn-soft:#3A2E17; --bad:#EC8A82; --bad-soft:#3D1F1D; --good:#74C493; --good-soft:#1E3828;
  --scene:#1B2722; --scene2:#121B16; --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
p{margin:0}
.num{font-variant-numeric:tabular-nums}

/* Struttura */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top-in{max-width:680px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{font-family:var(--f-display);font-weight:800;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.top h1{font-size:24px;font-weight:800;flex:1;min-width:0}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer}
.iconbtn svg{width:20px;height:20px;stroke:var(--fg)}
main{max-width:680px;margin:0 auto;padding-inline:16px;padding-block:14px calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{border:0;background:none;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;color:var(--muted);cursor:pointer}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="true"]{color:var(--accent);font-weight:700}

/* Componenti */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.flat{background:transparent;border:0;padding:0}
.card h2{font-size:19px;font-weight:700}
.card h3{font-size:16px;font-weight:700}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:14px}
.tiny{font-size:12.5px}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.row.wrap{flex-wrap:wrap}
.spread{justify-content:space-between}
.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-weight:700;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.soft{background:var(--accent-soft);border-color:transparent;color:var(--fg)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.block{width:100%}
.btn.sm{min-height:34px;padding:6px 10px;font-size:13.5px;border-radius:10px}
.btn:focus-visible,.chip:focus-visible,.tab:focus-visible,.iconbtn:focus-visible,.seg button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:8px 6px;font-weight:700;font-size:14px;color:var(--muted);cursor:pointer;min-height:38px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12.5px;font-weight:700;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.neutral{background:var(--surface2);color:var(--muted)}
.pill.lemon{background:var(--lemon-soft);color:var(--warn)}
.dot{width:12px;height:12px;border-radius:50%;flex:none;border:1px solid rgba(0,0,0,.12)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;color:var(--muted);min-width:0}
input[type=number],input[type=text],input[type=search],input[type=date],select,textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 11px;font-size:16px;min-height:44px;color:var(--fg);font-weight:400}
textarea{min-height:90px;resize:vertical}
input[type=search]{-webkit-appearance:none;appearance:none}
input[type=range]{width:100%;accent-color:var(--accent)}
.unit{position:relative}
.unit input{padding-right:38px}
.unit span{position:absolute;right:11px;top:50%;transform:translateY(-50%);font-size:14px;color:var(--muted);pointer-events:none}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0;cursor:pointer}
.switch input{width:46px;height:28px;appearance:none;-webkit-appearance:none;background:var(--line);border-radius:999px;position:relative;cursor:pointer;flex:none;transition:background .2s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{transform:translateX(18px)}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
.stepper button{width:38px;height:38px;border:0;background:var(--surface2);font-size:20px;font-weight:700;cursor:pointer}
.stepper b{width:30px;text-align:center;font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);min-width:0}
.li:first-child{border-top:0}
.li .t{flex:1;min-width:0}
.check{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);background:var(--surface);flex:none;display:grid;place-items:center;cursor:pointer}
.check[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.check[aria-checked="true"]::after{content:"";width:7px;height:12px;border:solid var(--accent-ink);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.done .t{text-decoration:line-through;color:var(--muted)}
.steps{counter-reset:s;display:flex;flex-direction:column;gap:12px;padding:0;margin:0;list-style:none}
.steps li{counter-increment:s;display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start}
.steps li::before{content:counter(s);width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:800;display:grid;place-items:center;font-size:14px;font-family:var(--f-display)}
.steps li > div{min-width:0}
.bul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px}
.note{border-radius:12px;padding:10px 12px;font-size:14px;display:flex;gap:9px;align-items:flex-start}
.note.good{background:var(--good-soft)} .note.warn{background:var(--warn-soft)} .note.bad{background:var(--bad-soft)} .note.info{background:var(--surface2)}
.note b.ic{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:12px;color:#fff}
.note.good b.ic{background:var(--good);color:var(--accent-ink)} .note.warn b.ic{background:var(--warn);color:var(--surface)} .note.bad b.ic{background:var(--bad);color:var(--surface)} .note.info b.ic{background:var(--muted);color:var(--surface)}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 8px 6px 0;border-bottom:1px solid var(--line)}
table.t td{padding:8px 8px 8px 0;border-bottom:1px solid var(--line);vertical-align:top}
table.t td.r,table.t th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}

/* Scena del terrario */
.scene{background:linear-gradient(180deg,var(--scene2),var(--scene));border-radius:var(--r);border:1px solid var(--line);padding:10px;display:flex;justify-content:center;overflow:hidden}
.scene svg{max-width:100%;height:auto;display:block}
.svl{fill:var(--fg);font-family:var(--f-body);font-size:12px;font-weight:700}
.svm{fill:var(--muted);font-family:var(--f-body);font-size:11px}
.svline{stroke:var(--muted);stroke-width:1;fill:none}
.svcur{fill:var(--accent)}
.hero-terr{display:flex;flex-direction:column;gap:10px}
.stagebar{display:flex;align-items:center;gap:10px}
.stagebar .grow{font-size:14px}
.progress{height:6px;background:var(--surface2);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);border-radius:99px}
.shape-pick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.shape-pick button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12.5px;cursor:pointer}
.shape-pick button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.shape-pick svg{width:34px;height:34px;stroke:var(--fg);fill:none;stroke-width:1.6}
.plantrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.plantrow:first-child{border-top:0}
.plantrow .pic{width:52px;height:52px;border-radius:10px;background:var(--scene);flex:none;display:grid;place-items:center;overflow:hidden}
.plantrow .pic svg{width:52px;height:52px}
.plantrow .t{flex:1;min-width:0}
.plantrow .t b{display:block}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:700;padding:0;cursor:pointer;font-size:inherit}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.months{display:grid;grid-template-columns:52px repeat(12,1fr);gap:2px;font-size:11px;align-items:center}
.months i{height:16px;border-radius:3px;background:var(--surface2)}
.months i.s{background:var(--accent)} .months i.p{background:var(--lemon)}
.months span.h{text-align:center;color:var(--muted)}
.months span.h.cur{color:var(--fg);font-weight:800}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .d{aspect-ratio:1;max-width:100%;border-radius:10px;border:1px solid transparent;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;font-variant-numeric:tabular-nums;font-size:14px;padding:0}
.cal .d.out{opacity:.35}
.cal .d.today{border-color:var(--accent);font-weight:800}
.cal .d.sel{background:var(--accent);color:var(--accent-ink)}
.cal .d i{width:6px;height:6px;border-radius:50%;background:var(--lemon)}
.cal .d.sel i{background:var(--accent-ink)}
.cal .wd{text-align:center;font-size:11px;color:var(--muted);font-weight:700}
.diary img{width:100%;border-radius:10px;display:block;max-height:340px;object-fit:cover}
.big-num{font-family:var(--f-display);font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}

/* Foglio modale */
.overlay{position:fixed;inset:0;background:rgba(10,18,12,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:680px;max-height:92%;border-radius:20px 20px 0 0;display:flex;flex-direction:column;overflow:hidden}
.sheet.anim{animation:up .22s ease-out}
a.btn{text-decoration:none;color:var(--fg)}
a.btn.primary{color:var(--accent-ink)}
.sheet-h{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--line);background:var(--surface)}
.sheet-h h2{font-size:20px;flex:1;min-width:0}
.sheet-b{overflow-y:auto;padding:14px 16px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;-webkit-overflow-scrolling:touch}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:700;z-index:60;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion: reduce){.sheet{animation:none}*{transition:none!important}}
@media (min-width:560px){.grid-wide2{display:grid;grid-template-columns:1fr 1fr;gap:14px}}
</style>

 'Gennaio: poche semine. Copri le insalate con tessuto non tessuto nelle notti sotto i 3 °C e pota le aromatiche secche.',

function terrGeom(t){
 const sh=t.shape;let H,maxW,open,wAt,area,depthTxt;
 if(sh==='cilindro'){const D=+t.d;H=+t.h;maxW=D;open=D;wAt=()=>D;area=()=>Math.PI*D*D/4;depthTxt=`Ø ${num(D)} × ${num(H)} cm`}
 else if(sh==='boccia'){const D=+t.d,R=D/2,o=Math.min(+t.o,D*0.95);H=R+Math.sqrt(Math.max(0,R*R-(o/2)**2));maxW=D;open=o;wAt=z=>2*Math.sqrt(Math.max(0,R*R-(z-R)**2));area=z=>Math.PI*(wAt(z)/2)**2;depthTxt=`Ø ${num(D)} cm, apertura ${num(o)} cm`}
 else if(sh==='rett'){const W=+t.w,P=+t.p;H=+t.h;maxW=W;open=Math.min(W,P);wAt=()=>W;area=()=>W*P;depthTxt=`${num(W)} × ${num(P)} × ${num(H)} cm`}
 else{const D=+t.d,o=Math.min(+t.o,D);H=+t.h;const Hb=H*0.62,Hs=H*0.8;maxW=D;open=o;wAt=z=>z<=Hb?D:z<=Hs?D-(D-o)*((z-Hb)/(Hs-Hb)):o;area=z=>Math.PI*(wAt(z)/2)**2;depthTxt=`Ø ${num(D)} × ${num(H)} cm, collo ${num(o)} cm`}
 const vol=(a,b)=>{const n=40,dz=(b-a)/n;let v=0;for(let i=0;i<n;i++)v+=area(a+dz*(i+.5))*dz;return v};
 return{shape:sh,H,maxW,open,wAt,area,vol,litri:vol(0,H)/1000,depthTxt};
}

function layerRec(t,G){
 G=G||terrGeom(t);const H=G.H,closed=t.closed;const sp=[...new Set(plantsOf(t))];const bio=!!(t.lay&&t.lay.bio)&&closed;
 const maxRoot=Math.max(3,...sp.filter(p=>!p.noSoil).map(p=>p.root));const deep=sp.filter(p=>!p.noSoil).sort((a,b)=>b.root-a.root)[0];
 const carn=sp.some(p=>p.soil==='carnivore'),lith=sp.some(p=>p.soil==='minerale');
 const why={};
 const drain=closed?(G.litri>8?'argilla':'lapillo'):'pomice';
 why.drain=closed?(G.litri>8?`Vaso grande (${num(G.litri,1)} L): l’argilla espansa pesa poco.`:'Il lapillo è poroso e trattiene un po’ d’acqua: ideale nei chiusi.'):'La pomice drena benissimo ed è perfetta con le piante grasse.';
 let drainCm=closed?clamp(r1(H*.12+(t.shape==='boccia'?.5:0)),2,5):clamp(r1(H*.1),2,4);
 const sep=closed?'rete':'no';why.sep=closed?'Senza separatore la terra scende nel drenaggio e in pochi mesi lo intasa.':'Con substrato minerale e grosso non serve: l’acqua scende comunque.';
 let charCm=closed?(H<16?.5:1):.5;why.char=closed?'Assorbe impurità: niente muffe e cattivi odori in un ambiente chiuso.':'Un velo sottile tiene sano il fondo, che nel vetro non asciuga mai del tutto.';
 const soil=closed?(carn?'carnivore':bio?'abg':'tropicale'):(lith?'minerale':'cactus');
 why.soil=carn?'Hai scelto una pianta carnivora: vuole torba povera e acida.':lith?'I lithops marciscono nella terra: serve un mix quasi solo minerale.':bio?'Nel bioattivo l’ABG mix resta soffice per anni e nutre i collemboli.':closed?'Il mix tropicale resta soffice e arioso: le radici respirano.':'Metà terriccio e metà pomice: drena in fretta e non marcisce.';
 const minSoil=Math.max(4,maxRoot+1);let soilCm=Math.max(clamp(r1(H*.2),4,9),Math.min(minSoil,10));
 why.soilCm=deep?`Le radici di ${deep.name} arrivano a circa ${deep.root} cm: servono almeno ${minSoil} cm di substrato.`:`Almeno ${minSoil} cm per le radici.`;
 const lim=H*.46;let tot=()=>drainCm+(SEPS[sep].h)+charCm+soilCm;
 if(tot()>lim){drainCm=Math.max(2,r1(lim-SEPS[sep].h-charCm-soilCm));if(tot()>lim)soilCm=Math.max(Math.max(3,maxRoot+1),r1(lim-drainCm-charCm));}
 why.drainCm=`Circa un decimo dell’altezza del vetro (${num(H)} cm): raccoglie l’acqua in eccesso senza togliere spazio alle piante.`;
 const top=closed?(bio?'foglie':'muschio'):'ghiaino';why.top=closed?(bio?'Le foglie secche sono cibo e riparo per i collemboli.':'Il muschio trattiene l’umidità e chiude il paesaggio.'):'Il ghiaino tiene asciutto il colletto delle piante grasse.';

}
function effLayers(t,G){const rec=layerRec(t,G);const l=t.lay||{};if(l.mode!=='custom')return{L:rec,rec};
 const L={mode:'custom',drain:DRAINS[l.drain]?l.drain:rec.drain,drainCm:clamp(+l.drainCm||0,0,10),sep:SEPS[l.sep]?l.sep:rec.sep,charCm:clamp(+l.charCm||0,0,3),soil:SOILS[l.soil]?l.soil:rec.soil,soilCm:clamp(+l.soilCm||1,1,20),top:TOPS[l.top]?l.top:rec.top,bio:!!l.bio&&t.closed};

function layerAdvice(t,L,rec,G){const H=G.H,closed=t.closed,A={};const sp=[...new Set(plantsOf(t))];
 const d=L.drainCm;A.drain=d<1?{l:'bad',t:'Senza drenaggio l’acqua ristagna sul fondo del vetro e le radici marciscono.'}:d<rec.drainCm-1?{l:'warn',t:`Poco drenaggio: in un vetro senza fori l’acqua in eccesso deve avere dove andare. Consigliati ${num(rec.drainCm)} cm.`}:d>rec.drainCm+2?{l:'warn',t:`Troppo spesso: toglie spazio a terra e piante. Ne bastano ${num(rec.drainCm)} cm.`}:{l:'ok',t:'Spessore giusto.'};

 if(S.env==='chiuso'&&!closed||S.env==='aperto'&&closed)so={l:'bad',t:`${S.name} è pensato per il terrario ${S.env}. Per il tuo è consigliato: ${SOILS[rec.soil].name}.`};

 else if(L.soil==='carnivore'&&sp.some(p=>p.soil!=='carnivore'))so={l:'warn',t:'Torba e perlite sono troppo povere per le altre piante: tieni la carnivora in un terrario a parte.'};

/* Composizione suggerita: una pianta alta, medie, basse e una ricadente, tutte adatte */
function suggestPlants(t,seed){const G=terrGeom(t);const{L}=effLayers(t,G);const S=L.drainCm+SEPS[L.sep].h+L.charCm+L.soilCm;const free=G.H-S;const area=G.area(S);const R=rng(seed||1);
 const ok=TPLANTS.filter(p=>(t.closed?p.env!=='aperto':p.env!=='chiuso')&&p.diff!=='difficile'&&(ui.tRep?p.rep==='facile':p.rep!=='rara')&&!p.soil&&p.h<=free-2&&p.root<=L.soilCm+1);
 const pick=(roles,n,used)=>{const c=ok.filter(p=>roles.includes(p.role)&&!used.has(p.id)).sort(()=>R()-.5);return c.slice(0,n)};
 const used=new Set(),out={};let fp=0;const add=p=>{if(!p)return false;const f=Math.PI*(p.w*.25)**2;if((fp+f)/area>.65)return false;fp+=f;out[p.id]=(out[p.id]||0)+1;used.add(p.id);return true};

function terrPlan(t){
 const G=terrGeom(t),H=G.H,closed=t.closed,checks=[];
 const{L,rec}=effLayers(t,G);const adv=layerAdvice(t,L,rec,G);
 if(H<12)checks.push({l:'warn',t:'Contenitore molto basso: resta poco spazio per le piante. Scegli piante basse come selaginella, pilea o muschio.'});
 const dh=L.drainCm,sepH=SEPS[L.sep].h,ch=L.charCm,sh=L.soilCm;
 const z1=dh,zs=z1+sepH,z2=zs+ch,S=z2+sh;
 const ws=G.wAt(Math.min(S,H-.5));
 const extra=t.collina&&ws>10?Math.min(3,sh*.45):0;
 const surf=x=>{const u=Math.abs(x)/(ws/2);return S+(u<1?extra*(1-u*u):0)};
 const dr=DRAINS[L.drain],so=SOILS[L.soil],tp=TOPS[L.top];
 const drainL=G.vol(0,z1)/1000,sepL=sepH?G.vol(z1,zs)/1000:0,charL=ch?G.vol(zs,z2)/1000:0,soilL=(G.vol(z2,S)+G.area(S)*extra*.53)/1000;
 const surfA=G.area(S);const coverL=surfA*.8/1000*.6;
 const charG=ch?Math.max(10,Math.ceil(charL*500/10)*10):0;const drainG=Math.max(50,drainL*dr.dens*1000);
 const items=plantsOf(t);const sorted=[...items].sort((a,b)=>b.h-a.h||a.id.localeCompare(b.id));const species=[...new Set(sorted.map(p=>p.id))];
 const margin=1.2,usable=Math.max(2,ws-2*margin),n=sorted.length;const slots=[];for(let k=0;k<n;k++)slots.push(-usable/2+usable*(k+.5)/n);
 const order=slots.map((x,i)=>i).sort((a,b)=>Math.abs(slots[a])-Math.abs(slots[b])||slots[a]-slots[b]);
 const depthS=t.shape==='rett'?+t.p:ws;const Rj=rng(hashStr(t.id+'y'));
 const placed=sorted.map((p,i)=>{let x=slots[order[i]];let back=i%2===0&&p.h>=10&&n>2;
   if(p.draw==='ficus'){x=(i%2?1:-1)*(ws/2-1.4);back=true}
   if(p.role==='ricadente'&&n>2&&Math.abs(x)<ws*.25)x=(i%2?1:-1)*(ws/2-p.w*.35);
   let y=(back?-depthS*.22:depthS*.16)+(Rj()-.5)*depthS*.12;if(p.draw==='ficus')y=-depthS/2+1.6;if(p.role==='ricadente')y=depthS*.25;
   if(t.shape!=='rett'){const lim=Math.max(0,ws/2-p.w*.3),d=Math.hypot(x,y);if(d>lim&&d>0){x*=lim/d;y*=lim/d}}else{y=clamp(y,-depthS/2+p.w*.3,depthS/2-p.w*.3)}
   return{p,x,y,back}});

 const st={};
 if(dh>0){st.drain=steps.length;steps.push({title:'Strato di drenaggio',text:`Versa ${num(drainL,2)} L di ${dr.name.toLowerCase()} (circa ${num(drainG,0)} g) fino a ${num(dh)} cm e livellalo con il cucchiaio. ${dr.desc}`})}
 if(L.sep!=='no'){st.sep=steps.length;steps.push({title:'Strato separatore',text:L.sep==='sfagno'?`Stendi uno strato di sfagno secco di circa ${num(sepH)} cm, leggermente inumidito, sopra il drenaggio. Separa la terra dai sassi.`:`Ritaglia un disco di ${L.sep==='rete'?'rete per zanzariere':'tessuto non tessuto'} largo ${num(G.wAt(z1),0)} cm e appoggialo sul drenaggio, senza lasciare fessure lungo il vetro.`})}
 if(ch>0){st.char=steps.length;steps.push({title:'Carbone attivo',text:`Spargi ${charG} g di carbone attivo in uno strato sottile di ${num(ch)} cm. Tiene puliti acqua e aria e limita muffe e cattivi odori.`})}
 st.soil=steps.length;
 const recipe=so.recipe.map(([n,f])=>`${n} ${Math.round(f*100)}% (${num(soilL*f,2)} L)`).join(', ');
 steps.push({title:`Substrato: ${so.name}`,text:`${so.recipe.length>1?`In una bacinella mescola: ${recipe}. `:`Ti servono ${num(soilL,2)} L di ${so.recipe[0][0].toLowerCase()}. `}${closed?`Inumidiscilo: stretto in mano deve restare compatto senza gocciolare${L.soil==='carnivore'?' (usa solo acqua distillata o piovana)':''}.`:'Usalo asciutto.'} Versalo fino a ${num(sh)} cm${extra?` e modella al centro una collinetta alta ${num(extra)} cm in più: dà profondità alla scena`:''}.`});
 const plantStage={};
 species.forEach((id,i)=>{const p=TP[id];const cnt=items.filter(x=>x.id===id).length;plantStage[id]=steps.length;
  const pos=i===0?'al centro o sul fondo, perché è la più alta':p.role==='ricadente'||p.role==='rampicante'?'vicino al vetro, così può ricadere o arrampicarsi':p.h<=6?'in primo piano, davanti':'tra le altre, lasciando 2 cm dal vetro';
  steps.push({title:`Pianta: ${p.name}${cnt>1?' ×'+cnt:''}`,text:p.noSoil?`Non va interrata: appoggiala su un sasso o tra i rami del legnetto, ${pos}.`:`Togli la pianta dal vasetto e scuoti via metà della terra; accorcia le radici più lunghe. Scava una buca profonda ${num(Math.min(p.root,sh))} cm con il cucchiaio, ${pos}. Inseriscila con le pinzette e compatta la terra attorno.${p.h>H-S-2?' Attenzione: è alta quasi quanto lo spazio libero, accorciala.':''}`})});
 const mossCm2=Math.round(Math.max(surfA*.3,surfA*.85-items.reduce((a,p)=>a+Math.PI*(p.w*.5/2)**2,0)));
 if(L.top!=='nessuno'){st.cover=steps.length;const tt={muschio:`Copri la terra rimasta scoperta con muschio vivo: circa ${num(mossCm2,0)} cm². Premi bene i pezzi con le dita perché aderiscano.`,foglie:'Spargi una manciata di foglie secche (quercia o catappa), prima bollite 5 minuti per pulirle.',corteccia:`Spargi ${num(coverL,2)} L di corteccia fine tra le piante.`,ghiaino:`Spargi ${num(coverL,2)} L di ghiaino fine attorno alle piante, anche sotto le foglie basse.`,sabbia:`Spargi ${num(coverL,2)} L di sabbia lavata attorno alle piante.`};steps.push({title:`Copertura: ${tp.name.toLowerCase()}`,text:tt[L.top]})}
 const dec=t.decor||{};
 if(dec.sassi||dec.legno||dec.ghiaietto){st.decor=steps.length;const d=[];if(dec.legno)d.push('appoggia il legnetto inclinato su un lato, puntandolo nella terra');if(dec.sassi)d.push('sistema 4–6 sassi vicino al vetro, in gruppi dispari');if(dec.ghiaietto)d.push('disegna un sentiero di ghiaietto bianco in primo piano');steps.push({title:'Decorazioni',text:d.join('; ').replace(/^./,c=>c.toUpperCase())+'.'})}
 if(L.bio){st.bio=steps.length;steps.push({title:'Squadra di pulizia: collemboli',text:'Versa i collemboli (una manciata della loro coltura) vicino alle foglie secche. Mangeranno muffe e foglie morte: il terrario si pulisce da solo.'})}
 const waterMl=Math.max(20,Math.round(soilL*1000*(closed?.08:.05)/10)*10);
 st.final=steps.length;
 steps.push(closed?{title:'Annaffia e chiudi',text:`Spruzza ${waterMl} ml d’acqua${L.soil==='carnivore'?' distillata':''} su piante e ${L.top==='muschio'?'muschio':'superficie'} (meglio poca che troppa). Pulisci il vetro con il pennello e un panno, chiudi il coperchio. Mettilo in luce intensa ma mai al sole diretto.`}:{title:'Prima acqua',text:`Aspetta 3–4 giorni prima di annaffiare, così le radici rovinate guariscono. Poi versa ${waterMl} ml alla base delle piante. Tienilo vicino a una finestra luminosa, anche al sole del mattino.`});
 // verifiche
 const fp=items.reduce((a,p)=>a+Math.PI*(p.w*.5/2)**2,0);const ratio=surfA?fp/surfA:0;
 if(!items.length)checks.push({l:'warn',t:'Non hai ancora scelto le piante: prova “Suggeriscimi le piante”.'});
 else if(ratio>1.0)checks.push({l:'bad',t:`Troppe piante: occupano il ${Math.round(ratio*100)}% della superficie. Togline qualcuna o scegli un vaso più grande.`});
 else if(ratio>.78)checks.push({l:'warn',t:`Terrario pieno (${Math.round(ratio*100)}% della superficie): bello subito, ma dovrai potare spesso.`});
 else checks.push({l:'ok',t:`Spazio giusto: le piante occupano il ${Math.round(ratio*100)}% della superficie e hanno margine per crescere.`});
 const free=H-S;const tooTall=species.map(id=>TP[id]).filter(p=>p.h>free-2);
 if(tooTall.length)checks.push({l:'warn',t:`${tooTall.map(p=>p.name).join(', ')}: rischia di toccare il ${closed?'coperchio':'bordo'} (spazio libero ${num(free)} cm). Scegline una più bassa o accorciala.`});
 else if(items.length)checks.push({l:'ok',t:`Altezza: ${num(free)} cm liberi sopra la terra, sufficienti per tutte le piante.`});
 if(closed){const bad=species.map(id=>TP[id]).filter(p=>p.env==='aperto');if(bad.length)checks.push({l:'bad',t:`${bad.map(p=>p.name).join(', ')}: in un terrario chiuso marcisce per l’umidità.`})}
 else{const hum=species.map(id=>TP[id]).filter(p=>p.env==='chiuso');if(hum.length)checks.push({l:'warn',t:`${hum.map(p=>p.name).join(', ')} vuole umidità alta: nel terrario aperto soffre.`})}
 const diff=species.map(id=>TP[id]).filter(p=>p.diff==='difficile');if(diff.length)checks.push({l:'info',t:`${diff.map(p=>p.name).join(', ')}: pianta delicata, da tenere d’occhio le prime settimane.`});
 if(minOpen<3)checks.push({l:'bad',t:`Apertura di ${num(minOpen)} cm: troppo stretta per inserire piante con radici.`});
 else if(minOpen<6)checks.push({l:'warn',t:`Apertura di ${num(minOpen)} cm: servono pinzette lunghe e piantine piccole.`});
 else checks.push({l:'ok',t:`Apertura di ${num(minOpen)} cm: ci lavori comodamente${minOpen<10?' con le pinzette':' anche con le mani'}.`});
 if(!closed&&G.open<G.maxW*.5)checks.push({l:'warn',t:'Per le piante grasse serve un contenitore con bocca larga: l’aria deve circolare.'});
 const badL=Object.values(adv).filter(a=>a.l==='bad'||a.l==='warn');
 if(badL.length)checks.push({l:badL.some(a=>a.l==='bad')?'bad':'warn',t:`Strati: ${badL.length} ${badL.length>1?'consigli':'consiglio'} da guardare nella sezione Strati.`});
 else checks.push({l:'ok',t:L.mode==='custom'?'Strati: tutti coerenti con vaso e piante.':'Strati calcolati automaticamente per il tuo vaso e le tue piante.'});
 const lights=[...new Set(species.map(id=>TP[id].light))];
 // materiali
 const mats=[];
 mats.push({g:'Terrario',t:`Contenitore in vetro ${SHAPES[t.shape].name.toLowerCase()}${closed?' con coperchio':''}`,q:`${G.depthTxt} · ${num(G.litri,1)} L`});
 if(dh>0)mats.push({g:'Terrario',t:dr.name,q:`${num(drainL,2)} L · circa ${num(drainG,0)} g`});
 if(L.sep==='rete')mats.push({g:'Terrario',t:'Rete per zanzariere (un ritaglio)',q:`disco Ø ${num(G.wAt(z1),0)} cm`});
 if(L.sep==='tnt')mats.push({g:'Terrario',t:'Tessuto non tessuto (un ritaglio)',q:`disco Ø ${num(G.wAt(z1),0)} cm`});
 if(L.sep==='sfagno')mats.push({g:'Terrario',t:'Sfagno secco',q:`${num(Math.max(.2,sepL),2)} L (una manciata)`});
 if(ch>0)mats.push({g:'Terrario',t:'Carbone attivo per acquari',q:`${charG} g (confezione da 100–200 g)`});
 so.recipe.forEach(([nm,f])=>mats.push({g:'Terrario',t:nm,q:`${num(Math.max(.05,soilL*f),2)} L${so.recipe.length>1?` (${Math.round(f*100)}% del substrato)`:''}`}));
 if(L.top==='muschio'){const v=Math.max(1,Math.ceil(mossCm2/300));mats.push({g:'Terrario',t:'Muschio vivo in foglio',q:`${num(mossCm2,0)} cm² · ${v} ${v>1?'vaschette':'vaschetta'} 20×15 cm`})}
 if(L.top==='foglie')mats.push({g:'Terrario',t:'Foglie secche di quercia o catappa',q:'una manciata, bollite 5 minuti'});
 if(L.top==='corteccia')mats.push({g:'Terrario',t:'Corteccia fine decorativa',q:`${num(coverL,2)} L`});
 if(L.top==='ghiaino')mats.push({g:'Terrario',t:'Ghiaino decorativo fine',q:`${num(coverL,2)} L`});
 if(L.top==='sabbia')mats.push({g:'Terrario',t:'Sabbia lavata decorativa',q:`${num(coverL,2)} L`});
 if(L.bio)mats.push({g:'Terrario',t:'Coltura di collemboli (springtails)',q:'1 vasetto'});
 if(L.soil==='carnivore')mats.push({g:'Terrario',t:'Acqua distillata o piovana',q:'1 bottiglia (per le annaffiature)'});
 species.forEach(id=>{const p=TP[id];const c=items.filter(x=>x.id===id).length;mats.push({g:'Piante per terrario',t:`${p.name} (${p.latin})`,q:`${c} in vasetto da 6–8 cm`})});
 if(dec.sassi)mats.push({g:'Terrario',t:'Sassi di fiume piccoli',q:'5–7 pezzi, lavati e bolliti'});
 if(dec.legno)mats.push({g:'Terrario',t:'Legnetto di radice o mangrovia',q:`lungo ${num(Math.round(ws*.5),0)}–${num(Math.round(ws*.7),0)} cm`});
 if(dec.ghiaietto)mats.push({g:'Terrario',t:'Ghiaietto bianco decorativo',q:'una manciata (0,2 L)'});
 mats.push({g:'Attrezzi',t:'Pinzette lunghe 25–30 cm',q:'1'});
 mats.push({g:'Attrezzi',t:'Spruzzino per acqua',q:'1'});
 if(minOpen<8)mats.push({g:'Attrezzi',t:'Imbuto (o un cono di carta)',q:'1'});
 mats.forEach(m=>m.w=whereFor(m));
 const layers=[];
 if(dh>0)layers.push({key:'drain',name:dr.name,z0:0,z1,stage:st.drain,sub:`${num(dh)} cm · ${num(drainL,2)} L · ${num(drainG,0)} g`});
 if(L.sep!=='no')layers.push({key:'sep',name:SEPS[L.sep].name,z0:z1,z1:zs,stage:st.sep,sub:sepH?`${num(sepH)} cm`:'tra drenaggio e carbone'});
 if(ch>0)layers.push({key:'char',name:'Carbone attivo',z0:zs,z1:z2,stage:st.char,sub:`${num(ch)} cm · ${charG} g`});
 layers.push({key:'soil',name:so.name,z0:z2,z1:S,stage:st.soil,sub:`${num(sh)}${extra?'+'+num(extra):''} cm · ${num(soilL,2)} L`});
 if(L.top!=='nessuno')layers.push({key:'cover',name:tp.name,z0:S,z1:S+extra+.4,stage:st.cover,sub:L.top==='muschio'?`${num(mossCm2,0)} cm²`:L.top==='foglie'?'una manciata':`${num(coverL,2)} L`});
 return{G,H,S,z1,zs,z2,dh,ch,sh,extra,ws,depthS,surf,L,rec,adv,layers,items:placed,species,steps,stages:{...st,plant:plantStage},checks,mats,waterMl,lights,coverL,mossCm2};
}

/* =================== DISEGNO TERRARIO =================== */
let svgN=0;
function leafP(x,y,ang,len,wid){const r=ang*Math.PI/180,ux=Math.sin(r),uy=-Math.cos(r),px=-uy,py=ux;const tx=x+ux*len,ty=y+uy*len;const mx=x+ux*len*.45,my=y+uy*len*.45;return`M${x.toFixed(1)} ${y.toFixed(1)}Q${(mx-px*wid).toFixed(1)} ${(my-py*wid).toFixed(1)} ${tx.toFixed(1)} ${ty.toFixed(1)}Q${(mx+px*wid).toFixed(1)} ${(my+py*wid).toFixed(1)} ${x.toFixed(1)} ${y.toFixed(1)}Z`}
function along(x,y,ang,d){const r=ang*Math.PI/180;return[x+Math.sin(r)*d,y-Math.cos(r)*d]}
function shade(hex,amt){let c=hex.replace('#','');if(c.length===3)c=c.split('').map(x=>x+x).join('');const n=parseInt(c,16);let r=(n>>16)+amt,g=(n>>8&255)+amt,b=(n&255)+amt;r=clamp(r,0,255);g=clamp(g,0,255);b=clamp(b,0,255);return'#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1)}

function drawPlant(p,bx,by,s,R){
 const h=p.h*s,w=p.w*s,c=p.color;let o='';
 switch(p.draw){
 case'fittonia':case'hypoestes':{const n=p.draw==='fittonia'?9:8;const idx=[...Array(n).keys()].sort((a,b)=>Math.abs(b-(n-1)/2)-Math.abs(a-(n-1)/2));
  for(const i of idx){const ang=-78+156*i/(n-1)+(R()-.5)*10;const len=h*(.5+R()*.18)*(1-Math.abs(ang)/260);const wid=len*.42;const col=shade(c,Math.round((R()-.5)*24));
   const sx=bx+(R()-.5)*w*.15;o+=`<path d="${leafP(sx,by,ang,len,wid)}" fill="${col}" stroke="${shade(c,-30)}" stroke-width=".6"/>`;
   if(p.draw==='fittonia'){const[tx,ty]=along(sx,by,ang,len*.9);o+=`<path d="M${sx} ${by}L${tx.toFixed(1)} ${ty.toFixed(1)}" stroke="${p.vein}" stroke-width=".9" opacity=".9"/>`;
    for(const t of[.35,.55,.72]){const[mx,my]=along(sx,by,ang,len*t);for(const sg of[-1,1]){const[ex,ey]=along(mx,my,ang+sg*62,wid*.38);o+=`<path d="M${mx.toFixed(1)} ${my.toFixed(1)}L${ex.toFixed(1)} ${ey.toFixed(1)}" stroke="${p.vein}" stroke-width=".6" opacity=".85"/>`}}}
   else{for(let k=0;k<5;k++){const t=.25+R()*.6;const[mx,my]=along(sx,by,ang,len*t);const[ex,ey]=along(mx,my,ang+(R()<.5?-90:90),wid*R()*.3);o+=`<circle cx="${ex.toFixed(1)}" cy="${ey.toFixed(1)}" r="${(1+R()*1.6*s/8).toFixed(1)}" fill="${p.spot}"/>`}}}
  break}
 case'felce':{const n=8;for(let i=0;i<n;i++){const ang=-72+144*i/(n-1)+(R()-.5)*8;const L=h*(.85+R()*.2)*(1-Math.abs(ang)/300);
  const r=ang*Math.PI/180;const tip=[bx+Math.sin(r)*L,by-Math.cos(r)*L*.8+(Math.abs(ang)>35?L*.18:0)];const ctl=[bx+Math.sin(r)*L*.35,by-L*.7];
  o+=`<path d="M${bx} ${by}Q${ctl[0].toFixed(1)} ${ctl[1].toFixed(1)} ${tip[0].toFixed(1)} ${tip[1].toFixed(1)}" stroke="${shade(c,-35)}" stroke-width="1" fill="none"/>`;
  for(let k=2;k<12;k++){const t=k/12;const x=(1-t)*(1-t)*bx+2*(1-t)*t*ctl[0]+t*t*tip[0],y=(1-t)*(1-t)*by+2*(1-t)*t*ctl[1]+t*t*tip[1];
   const dx=2*(1-t)*(ctl[0]-bx)+2*t*(tip[0]-ctl[0]),dy=2*(1-t)*(ctl[1]-by)+2*t*(tip[1]-ctl[1]);const a=Math.atan2(dx,-dy)*180/Math.PI;const ll=(1-t)*L*.16+1.2;
   o+=`<path d="${leafP(x,y,a-58,ll,ll*.28)}" fill="${shade(c,k%2?6:-6)}"/><path d="${leafP(x,y,a+58,ll,ll*.28)}" fill="${shade(c,k%2?-4:8)}"/>`}}
  break}
 case'asplenium':{const n=7;for(let i=0;i<n;i++){const ang=-48+96*i/(n-1)+(R()-.5)*6;const len=h*(.85+R()*.2)*(1-Math.abs(ang)/200);o+=`<path d="${leafP(bx,by,ang,len,len*.17)}" fill="${shade(c,Math.round((R()-.5)*20))}" stroke="${shade(c,-25)}" stroke-width=".6"/>`;const[tx,ty]=along(bx,by,ang,len*.92);o+=`<path d="M${bx} ${by}L${tx.toFixed(1)} ${ty.toFixed(1)}" stroke="#2F4A1E" stroke-width=".8"/>`}break}
 case'pilea':{for(let i=0;i<7;i++){const dir=i%2?1:-1;const reach=w*(.35+R()*.45);const ex=bx+dir*reach,ey=by+(R()<.5?h*.6:-h*.4);const cx=bx+dir*reach*.4,cy=by-h*(.6+R()*.4);
  o+=`<path d="M${bx} ${by}Q${cx.toFixed(1)} ${cy.toFixed(1)} ${ex.toFixed(1)} ${ey.toFixed(1)}" stroke="#9A4B4B" stroke-width=".9" fill="none"/>`;
  for(let k=1;k<=7;k++){const t=k/7;const x=(1-t)*(1-t)*bx+2*(1-t)*t*cx+t*t*ex,y=(1-t)*(1-t)*by+2*(1-t)*t*cy+t*t*ey;o+=`<ellipse cx="${(x+(R()-.5)*3).toFixed(1)}" cy="${y.toFixed(1)}" rx="${(s*.38).toFixed(1)}" ry="${(s*.3).toFixed(1)}" fill="${shade(c,Math.round((R()-.5)*26))}" stroke="${shade(c,-30)}" stroke-width=".4"/>`}}break}
 case'selaginella':case'cuscino':case'soleirolia':{const cnt=p.draw==='soleirolia'?60:p.draw==='cuscino'?34:46;const rr=p.draw==='soleirolia'?s*.32:p.draw==='cuscino'?s*.75:s*.62;
  for(let i=0;i<cnt;i++){const a=R()*Math.PI,d=Math.sqrt(R());const x=bx+Math.cos(a)*w*.5*d,y=by-Math.sin(a)*h*d;const col=p.draw==='cuscino'?shade(c,Math.round((R()-.3)*30)):shade(c,Math.round((R()-.5)*36));
   if(p.draw==='selaginella'){const ang=(R()-.5)*120;o+=`<path d="${leafP(x,y+rr*.5,ang,rr*2.2,rr*.5)}" fill="${col}"/>`}else o+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(rr*(.7+R()*.5)).toFixed(1)}" fill="${col}"/>`}break}
 case'peperomia':{for(let i=0;i<8;i++){const ang=-65+130*i/7+(R()-.5)*14;const len=h*(.55+R()*.3);const[ex,ey]=along(bx,by,ang,len);o+=`<path d="M${bx} ${by}L${ex.toFixed(1)} ${ey.toFixed(1)}" stroke="#B9707A" stroke-width="1"/>`;o+=`<ellipse cx="${ex.toFixed(1)}" cy="${ey.toFixed(1)}" rx="${(w*.15).toFixed(1)}" ry="${(w*.12).toFixed(1)}" transform="rotate(${ang.toFixed(0)} ${ex.toFixed(1)} ${ey.toFixed(1)})" fill="${shade(c,Math.round((R()-.5)*20))}" stroke="${shade(c,28)}" stroke-width=".8"/>`}if(p.flower){for(let i=0;i<4;i++){const[fx,fy]=along(bx,by,-30+20*i,h*(.9+R()*.2));for(let k=0;k<5;k++){const[px2,py2]=along(fx,fy,k*72,s*.45);o+=`<circle cx="${px2.toFixed(1)}" cy="${py2.toFixed(1)}" r="${(s*.32).toFixed(1)}" fill="${p.flower}"/>`}o+=`<circle cx="${fx.toFixed(1)}" cy="${fy.toFixed(1)}" r="${(s*.2).toFixed(1)}" fill="#F6D65A"/>`}}break}
 case'bromelia':{const n=10;for(let i=0;i<n;i++){const ang=-80+160*i/(n-1);const len=h*(Math.abs(ang)>50?.6:.85);o+=`<path d="${leafP(bx,by,ang,len,len*.14)}" fill="${shade(c,Math.round((R()-.5)*20))}" stroke="${shade(c,-25)}" stroke-width=".5"/>`}if(p.flower){for(let i=0;i<7;i++){const ang=-30+60*i/6;o+=`<path d="${leafP(bx,by-h*.15,ang,h*.55,h*.08)}" fill="${shade(p.flower,Math.round((R()-.5)*20))}"/>`}}break}
 case'cryptanthus':{const n=9;for(let i=0;i<n;i++){const ang=-86+172*i/(n-1);const len=w*.55*(1-Math.abs(Math.abs(ang)-86)/200);const lift=Math.abs(ang)>60?0:h*.1;o+=`<path d="${leafP(bx,by-lift,ang,len,len*.22)}" fill="${i%2?c:shade(c,-18)}" stroke="#E7C3CB" stroke-width=".7"/>`}o+=`<circle cx="${bx}" cy="${by-h*.15}" r="${(s*.6).toFixed(1)}" fill="${shade(c,-30)}"/>`;break}

function containerPath(G,X,Y){
 const H=G.H,sh=G.shape;
 if(sh==='cilindro'){const D=G.maxW,r=Math.min(1.6,D*.08);return`M${X(-D/2)} ${Y(H)}L${X(-D/2)} ${Y(r)}Q${X(-D/2)} ${Y(0)} ${X(-D/2+r)} ${Y(0)}L${X(D/2-r)} ${Y(0)}Q${X(D/2)} ${Y(0)} ${X(D/2)} ${Y(r)}L${X(D/2)} ${Y(H)}Z`}
 if(sh==='boccia'){const R=G.maxW/2,o=G.open,Rp=Math.abs(X(R)-X(0));return`M${X(-o/2)} ${Y(H)}A${Rp} ${Rp} 0 1 0 ${X(o/2)} ${Y(H)}Z`}
 if(sh==='rett'){const W=G.maxW;return`M${X(-W/2)} ${Y(H)}L${X(-W/2)} ${Y(0)}L${X(W/2)} ${Y(0)}L${X(W/2)} ${Y(H)}Z`}
 const D=G.maxW,o=G.open,Hb=H*.62,Hs=H*.8,r=Math.min(1.6,D*.08);
 return`M${X(-o/2)} ${Y(H)}L${X(-o/2)} ${Y(Hs)}Q${X(-D/2)} ${Y(Hs)} ${X(-D/2)} ${Y(Hb)}L${X(-D/2)} ${Y(r)}Q${X(-D/2)} ${Y(0)} ${X(-D/2+r)} ${Y(0)}L${X(D/2-r)} ${Y(0)}Q${X(D/2)} ${Y(0)} ${X(D/2)} ${Y(r)}L${X(D/2)} ${Y(Hb)}Q${X(D/2)} ${Y(Hs)} ${X(o/2)} ${Y(Hs)}L${X(o/2)} ${Y(H)}Z`;
}

function drawTerr(t,plan,opt={}){
 const G=plan.G,H=G.H,MW=G.maxW,closed=t.closed;
 const thumb=!!opt.thumb,mode=opt.mode||'risultato';
 const stage=mode==='passi'?opt.stage:99;
 const showFinal=mode==='risultato'||(mode==='passi'&&stage>=plan.stages.final);
 const labelW=(mode!=='risultato'&&!thumb)?172:0;
 const maxPx=thumb?118:(labelW?220:280);
 const s=Math.min(maxPx/MW,(thumb?150:330)/(H+2.5));
 const padX=thumb?8:16,padT=(thumb?8:16)+2.2*s,padB=thumb?10:18;
 const Wpx=padX*2+MW*s+labelW,Hpx=padT+H*s+padB;
 const cx=padX+MW*s/2,floor=padT+H*s;
 const X=cm=>+(cx+cm*s).toFixed(1),Y=z=>+(floor-z*s).toFixed(1);
 const id='g'+(++svgN)+'_';
 const k=thumb?.6:1;
 const path=containerPath(G,X,Y);
 let o=`<svg viewBox="0 0 ${Wpx.toFixed(0)} ${Hpx.toFixed(0)}" width="${Wpx.toFixed(0)}" height="${Hpx.toFixed(0)}" role="img" aria-label="Disegno del terrario in sezione"><defs>${patterns(id,k)}<clipPath id="${id}clip"><path d="${path}"/></clipPath><linearGradient id="${id}gl" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity=".0"/><stop offset=".12" stop-color="#fff" stop-opacity=".35"/><stop offset=".22" stop-color="#fff" stop-opacity="0"/><stop offset=".85" stop-color="#fff" stop-opacity="0"/><stop offset=".93" stop-color="#fff" stop-opacity=".18"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>`;
 o+=`<ellipse cx="${cx}" cy="${floor+3}" rx="${MW*s*.52}" ry="${Math.max(3,s*.8)}" fill="#000" opacity=".10"/>`;
 o+=`<path d="${path}" fill="#CFE6E1" fill-opacity=".35"/>`;
 o+=`<g clip-path="url(#${id}clip)">`;
 const L=MW/2+1;
 const LY=plan.L;const SP=SOILS[LY.soil].pat;
 const band=(z0,z1,fill)=>`<rect x="${X(-L)}" y="${Y(z1)}" width="${(2*L*s).toFixed(1)}" height="${(Math.max(.1,z1-z0)*s+(z0===0?2:0)).toFixed(1)}" fill="${fill}"/>`;
 if(plan.dh>0&&stage>=plan.stages.drain)o+=band(0,plan.z1,`url(#${id}${DRAINS[LY.drain].pat})`);
 if(LY.sep!=='no'&&stage>=plan.stages.sep){if(LY.sep==='sfagno')o+=band(plan.z1,plan.zs,`url(#${id}sfagno)`);else o+=`<path d="M${X(-L)} ${Y(plan.z1)}L${X(L)} ${Y(plan.z1)}" stroke="${LY.sep==='rete'?'#2E3A36':'#F4F4F0'}" stroke-width="${thumb?1:LY.sep==='rete'?1.6:2.4}" ${LY.sep==='rete'?'stroke-dasharray="3 2"':''}/>`}
 if(plan.ch>0&&stage>=plan.stages.char)o+=band(plan.zs,plan.z2,`url(#${id}char)`);
 const pts=[];const N=36;for(let i=0;i<=N;i++){const x=-L+2*L*i/N;pts.push([x,plan.surf(x)])}
 if(stage>=plan.stages.soil){let d=`M${X(-L)} ${Y(plan.z2)}`;pts.forEach(([x,z])=>d+=`L${X(x)} ${Y(z)}`);d+=`L${X(L)} ${Y(plan.z2)}Z`;o+=`<path d="${d}" fill="url(#${id}${SP})"/>`}
 const R=rng(hashStr(t.id+'x'));
 const coverOn=plan.stages.cover!=null&&stage>=plan.stages.cover;
 const coverBand=(pat,th)=>{let d=`M${X(-L)} ${Y(plan.surf(-L))}`;pts.forEach(([x,z])=>d+=`L${X(x)} ${Y(z+th)}`);for(let i=pts.length-1;i>=0;i--)d+=`L${X(pts[i][0])} ${Y(pts[i][1])}`;return`<path d="${d}Z" fill="url(#${id}${pat})"/>`};
 if(coverOn&&LY.top==='sabbia')o+=coverBand('sand',.7);
 if(coverOn&&LY.top==='ghiaino')o+=coverBand('gravel',.8);
 if(coverOn&&LY.top==='corteccia')o+=coverBand('bark',.8);
 // decorazioni dietro (legno)

function contGeom(c){const t=c.type;let area,vol,dimTxt;const h=+c.h;
 if(t==='tondo'){const D=+c.d;area=Math.PI*D*D/4*.92;dimTxt=`Ø ${D} × ${h} cm`}
 else if(t==='quadrato'){area=c.l*c.l;dimTxt=`${c.l} × ${c.l} × ${h} cm`}
 else{area=c.l*c.w;dimTxt=`${c.l} × ${c.w} × ${h} cm`}
 const drainCm=h>=20?3:2;const soilL=area*(h-drainCm-2.5)/1000;const drainL=area*drainCm/1000;const totL=area*h/1000;
 return{area,soilL:Math.max(0,soilL),drainL,totL,dimTxt,drainCm};}

function ortoLayout(c){
 const crops=c.crops.filter(x=>CROP[x.id]);const tot=crops.reduce((a,x)=>a+(+x.share||1),0)||1;const zones=[];
 if(c.type==='tondo'&&crops.length>1&&CROP[crops[0].id].sp>=c.d*0.6){const R=c.d/2;const big=crops[0],bc=CROP[big.id];zones.push({cz:big,cr:bc,a0:-Math.PI/2,a1:-Math.PI/2,pts:[[0,0]],tight:bc.sp>c.d});
  const rest=crops.slice(1);const rt=rest.reduce((a,x)=>a+(+x.share||1),0)||1;let a0=-Math.PI/2;
  rest.forEach(cz=>{const cr=CROP[cz.id];const a1=a0+(+cz.share||1)/rt*2*Math.PI;const rr=R-Math.max(3,cr.sp*.55);const pts=[];if(rr>0){const n=Math.max(1,Math.floor((a1-a0)*rr/cr.sp));for(let i=0;i<n;i++){const a=a0+(a1-a0)*(i+.5)/n;pts.push([Math.cos(a)*rr,Math.sin(a)*rr])}}zones.push({cz,cr,a0,a1,pts,tight:false,ring:true});a0=a1});
  return{round:true,R,zones,ringMode:true}}
 if(c.type==='tondo'){const R=c.d/2;let a0=-Math.PI/2;let first=true;
  crops.forEach(cz=>{const cr=CROP[cz.id];const frac=(+cz.share||1)/tot;const a1=a0+frac*2*Math.PI;const sp=cr.sp;const pts=[];
   const kk=Math.ceil(R/sp)+1;for(let i=-kk;i<=kk;i++)for(let j=-kk;j<=kk;j++){const x=i*sp,y=j*sp;const d=Math.hypot(x,y);if(d>R-sp*.4)continue;
    if(d<1e-6){if(first)pts.push([x,y]);continue}let a=Math.atan2(y,x);while(a<a0)a+=2*Math.PI;if(a<a1||crops.length===1)pts.push([x,y])}
   let tight=false;if(!pts.length&&R*frac*2>sp*.4){const am=(a0+a1)/2;pts.push([Math.cos(am)*R*.5,Math.sin(am)*R*.5]);tight=true}
   zones.push({cz,cr,a0,a1,pts,tight});a0=a1;first=false});
  return{round:true,R,zones}}
 const L=+c.l,W=c.type==='quadrato'?+c.l:+c.w;let x0=0;
 crops.forEach(cz=>{const cr=CROP[cz.id];const len=L*(+cz.share||1)/tot;const sp=cr.sp;let nx=Math.floor(len/sp),ny=Math.floor(W/sp);let tight=false;
  if((nx<1||ny<1)&&len>=sp*.5&&W>=sp*.5){nx=Math.max(1,nx);ny=Math.max(1,ny);tight=true}
  const pts=[];const ox=x0+(len-nx*sp)/2+sp/2,oy=(W-ny*sp)/2+sp/2;for(let i=0;i<nx;i++)for(let j=0;j<ny;j++)pts.push([ox+i*sp,oy+j*sp]);
  if(tight&&pts.length===1){pts[0]=[x0+len/2,W/2]}
  zones.push({cz,cr,x0,x1:x0+len,pts,tight});x0+=len});
 return{round:false,L,W,zones};
}

function ortoChecks(c){
 const out=[];const m=CUR_M();const lay=ortoLayout(c);
 c.crops.forEach(cz=>{const cr=CROP[cz.id];if(!cr)return;
  if(cr.minH>c.h)out.push({l:'bad',t:`${cr.name}: serve un vaso profondo almeno ${cr.minH} cm (questo è ${c.h} cm).`});
  const mm=cr[cz.m]&&cr[cz.m].m;if(mm&&!mm.includes(m))out.push({l:'warn',t:`${cr.name} (${methodName(cr,cz.m).toLowerCase()}): fuori periodo. Ad Alcamo si fa in ${monthsTxt(mm)}.`});
  if(cr.alone&&c.crops.length>1)out.push({l:'warn',t:`${cr.name} invade i vicini: meglio un vaso tutto suo.`});
 });
 lay.zones.forEach(z=>{if(!z.pts.length)out.push({l:'bad',t:`${z.cr.name}: spazio insufficiente, servono almeno ${z.cr.sp} cm. Aumenta la sua quota o usa un vaso più grande.`});else if(z.tight)out.push({l:'warn',t:`${z.cr.name}: entra una sola pianta e starà stretta. Tra 1–2 anni rinvasala.`})});
 for(let i=0;i<c.crops.length;i++)for(let j=i+1;j<c.crops.length;j++){const a=CROP[c.crops[i].id],b=CROP[c.crops[j].id];if(!a||!b)continue;
  if(a.avoid.includes(b.id)||b.avoid.includes(a.id))out.push({l:'warn',t:`${a.name} e ${b.name} non vanno d’accordo: meglio in vasi separati.`});
  else if(a.friends.includes(b.id)||b.friends.includes(a.id))out.push({l:'ok',t:`${a.name} e ${b.name} stanno bene insieme.`})}
 return out;
}

 });
 const sacchi50=Math.ceil(soil/50);const resto=soil-(sacchi50-1)*50;
 if(soil>0)mats.push({g:'Terra e substrati',t:'Terriccio per orto (con concime organico)',q:`${num(soil,0)} L → ${soil<=20?'1 sacco da 20 L':sacchi50+' sacc'+(sacchi50>1?'hi':'o')+' da 50 L'}`,p:soil<=20?[4,6]:[7*sacchi50,10*sacchi50]});
 if(drain>0){const n=Math.ceil(drain/10);mats.push({g:'Terra e substrati',t:'Argilla espansa',q:`${num(drain,0)} L → ${n} sacc${n>1?'hi':'o'} da 10 L`,p:[4*n,6*n]})}
 if(soil>0){const kg=Math.max(3,Math.ceil(soil*.1*.6));mats.push({g:'Terra e substrati',t:'Humus di lombrico o letame pellettato',q:`${kg} kg (1 parte ogni 10 di terriccio)`,p:[kg*1.2,kg*2]})}
 if(mixL>0)mats.push({g:'Terra e substrati',t:'Sabbia di fiume o lapillo fine (per le aromatiche)',q:`${num(Math.max(2,mixL),0)} L`,p:[3,5]});

 const seen={};let sup=0;

 Object.values(seen).forEach(({cr,m,n,conts})=>{const pr=cr.price[m]||[1,2];

  else{const q=cr.id==='cipollotto'?`1 mazzetto (${n} piantine)`:`${n} piantin${n>1?'e':'a'}`;const mult=cr.id==='cipollotto'?1:n;mats.push({g:'Piantine',t:cr.name+(cr.cat==='aromatica'?' in vaso 14 cm':' in alveolo'),q,p:[pr[0]*mult,pr[1]*mult]})}});
 if(sup)mats.push({g:'Attrezzi',t:'Canne di bambù 120–150 cm e spago',q:`${sup} canne`,p:[Math.ceil(sup*.4),Math.ceil(sup*.7)]});

function dedupe(list){const seen=new Set();return list.filter(x=>{if(!x.group)return true;const k=x.group;if(seen.has(k))return false;seen.add(k);return true})}

function vLayers(t,plan){
 const L=plan.L,rec=plan.rec,A=plan.adv,custom=L.mode==='custom';const env=t.closed?'chiuso':'aperto';
 const rows=[
  {k:'drain',title:'Drenaggio',mat:'drain',opts:DRAINS,cm:'drainCm',min:0,max:8,why:rec.why.drain+' '+rec.why.drainCm,adv:[A.drain,A.drainMat]},
  {k:'sep',title:'Separatore',mat:'sep',opts:SEPS,why:rec.why.sep,adv:[A.sep]},
  {k:'char',title:'Carbone attivo',cm:'charCm',min:0,max:2,why:rec.why.char,adv:[A.char]},
  {k:'soil',title:'Substrato',mat:'soil',opts:Object.fromEntries(Object.entries(SOILS).filter(([k,v])=>v.env===env)),cm:'soilCm',min:2,max:15,why:rec.why.soil+' '+rec.why.soilCm,adv:[A.soil,A.soilCm]},

 const recTxt=r=>[r.mat?(r.opts[rec[r.mat]]||SOILS[rec[r.mat]]||{}).name:null,r.cm?num(rec[r.cm])+' cm':null].filter(Boolean).join(' · ');
 const curTxt=r=>[r.mat?(r.opts[L[r.mat]]||{name:L[r.mat]}).name:null,r.cm?num(L[r.cm])+' cm':null].filter(Boolean).join(' · ');
 let o=`<section class="card"><div class="eyebrow">Passo 3</div><h2>Gli strati</h2>

 rows.forEach((r,i)=>{const adv=r.adv.filter(Boolean);const worst=adv.find(a=>a.l==='bad')||adv.find(a=>a.l==='warn')||adv.find(a=>a.l==='info');const isRec=curTxt(r)===recTxt(r);

  if(r.k==='soil'){const so=SOILS[L.soil];if(so.recipe.length>1)o+=`<div class="tiny">Ricetta: ${so.recipe.map(([n,f])=>`${n} ${Math.round(f*100)}%`).join(' · ')}</div>`}
  if(custom){
   if(r.mat)o+=`<select id="lm_${r.k}" data-c="lmat" data-k="${r.mat}" aria-label="${r.title}">${Object.entries(r.opts).map(([k,v])=>`<option value="${k}" ${L[r.mat]===k?'selected':''}>${esc(v.name)}</option>`).join('')}</select>`;
   if(r.cm)o+=`<div class="row"><input type="range" id="lc_${r.k}" data-c="lcm" data-k="${r.cm}" min="${r.min}" max="${r.max}" step="0.5" value="${L[r.cm]}" aria-label="Spessore ${r.title}"><b class="num" id="lc_${r.k}_v" style="min-width:56px;text-align:right">${num(L[r.cm])} cm</b></div>`;
   adv.filter(a=>a.l!=='ok').forEach(a=>o+=note(a.l,esc(a.t)));
   if(!isRec)o+=`<div class="row spread"><span class="tiny muted">Consigliato: ${esc(recTxt(r))}</span><button class="btn sm soft" data-a="lrec" data-k="${r.k}">Usa il consigliato</button></div>`;
   else o+=`<span class="tiny muted">${esc(adv.find(a=>a.l==='ok')?adv.find(a=>a.l==='ok').t:'')}</span>`;

const GUIDES={
 orto:{t:'Manuale dell’orto in vaso',b:`<h3>Dove</h3><p class="small">Almeno 5–6 ore di sole diretto. In autunno e inverno ad Alcamo il sole basso è prezioso: usa il lato più luminoso del balcone. D’estate le insalate vogliono mezz’ombra.</p>
 <h3>Contenitori</h3><ul class="bul small"><li>Insalate, rucola, ravanelli: profondità 15–20 cm.</li><li>Spinaci, bietole, finocchi, aglio: 20–25 cm.</li><li>Cavoli, fave, carote, pomodori: 30–40 cm.</li><li>Sempre con fori sul fondo e un sottovaso da svuotare.</li></ul>
 <h3>Annaffiare</h3><ul class="bul small"><li>Infila un dito: se i primi 2 cm sono asciutti, annaffia.</li><li>Annaffia al mattino, alla base, fino a vedere l’acqua uscire dai fori.</li><li>Ottobre–novembre: 2–3 volte a settimana. Dicembre–febbraio: 1–2. Estate: ogni giorno.</li><li>L’acqua ferma nel sottovaso fa marcire le radici: svuotalo dopo mezz’ora.</li></ul>
 <h3>Concimare</h3><p class="small">Dalla terza settimana, concime liquido per orto ogni 3–4 settimane, alla dose dell’etichetta, sulla terra già umida. Le aromatiche ne vogliono pochissimo.</p>
 <h3>Semina a scalare</h3><p class="small">Per ravanelli, rucola e insalate semina poco ogni 2–3 settimane: avrai raccolto continuo invece che tutto insieme.</p>
 <h3>Freddo</h3><p class="small">Ad Alcamo raramente serve. Se le previsioni danno meno di 3 °C, copri le insalate di notte con tessuto non tessuto.</p>
 <h3>Dopo il raccolto</h3><p class="small">Smuovi la terra, togli le radici vecchie, aggiungi 2 manciate di humus e risemina. Non ripetere la stessa famiglia nello stesso vaso: dopo i cavoli metti legumi o insalate.</p>`},
 terr:{t:'Manuale del terrario',b:`<h3>Come funziona</h3><p class="small">In un terrario chiuso l’acqua evapora dalla terra e dalle foglie, si condensa sul vetro e ricade. Bastano pochissime annaffiature all’anno se l’equilibrio è giusto.</p>
 <h3>Gli strati, dal basso</h3><ol class="steps"><li><div class="small"><b>Drenaggio</b> (lapillo, ghiaia o argilla espansa): 2–5 cm, raccoglie l’acqua in eccesso.</div></li><li><div class="small"><b>Rete</b> facoltativa: separa la terra dai sassi.</div></li><li><div class="small"><b>Carbone attivo</b>: un velo di 0,5–1 cm contro muffe e odori.</div></li><li><div class="small"><b>Terriccio</b>: 4–9 cm, più alto dietro o al centro.</div></li><li><div class="small"><b>Piante, muschio e decorazioni</b>.</div></li></ol>
 <p class="small">In totale gli strati sotto le piante occupano circa un quarto o un terzo dell’altezza del vaso.</p>
 <h3>Leggere la condensa</h3><ul class="bul small"><li>Velo al mattino che sparisce di giorno: perfetto.</li><li>Vetro appannato tutto il giorno: troppa acqua, apri 2–4 ore.</li><li>Mai condensa e muschio che schiarisce: troppo secco, spruzza.</li></ul>
 <h3>Luce</h3><p class="small">Tanta luce ma mai sole diretto: dietro il vetro diventa una serra e cuoce le piante. Ottimo a 1–2 metri da una finestra luminosa.</p>
 <h3>Scegliere il substrato</h3><ul class="bul small"><li><b>Mix tropicale</b> (chiuso): terriccio 50%, fibra di cocco 20%, corteccia fine 20%, perlite 10%. Soffice, non si compatta.</li><li><b>ABG mix</b> (bioattivo): corteccia, torba, fibra di cocco, carbone e sfagno. Dura anni.</li><li><b>Torba e perlite</b>: solo per le carnivore, con acqua distillata.</li><li><b>Cactacee + pomice</b> (aperto): metà e metà, drena in fretta.</li><li><b>Mix minerale</b>: pomice, lapillo e akadama per lithops e cactus delicati.</li></ul>
 <h3>Terrario bioattivo</h3><p class="small">Con i collemboli (minuscoli insetti innocui) e uno strato di foglie secche, muffe e foglie morte vengono mangiate: il terrario si mantiene pulito da solo.</p>
 <h3>Terrario aperto con piante grasse</h3><p class="small">Substrato per cactacee mescolato a lapillo, bocca larga, sole o luce molto intensa. Acqua solo quando il substrato è asciutto del tutto.</p>`},
 diag:{t:'Cosa succede alle mie piante?',b:''},
 gloss:{t:'Parole dell’orto',b:`<dl class="stack small">${[['Diradare','Togliere le piantine in eccesso per lasciare spazio a quelle rimaste.'],['Colletto','Il punto dove il fusto incontra le radici.'],['Pane di terra','La zolla di terra attaccata alle radici della piantina.'],['Semina a file','Semi messi lungo un solco dritto.'],['Semina a spaglio','Semi sparsi sulla superficie, poi coperti.'],['Semina a scalare','Seminare poco alla volta ogni 2–3 settimane.'],['Semenzaio','Contenitore ad alveoli dove nascono le piantine prima del trapianto.'],['Rincalzare','Accumulare terra alla base della pianta.'],['Cimare','Tagliare la punta di un fusto perché la pianta si infittisca.'],['Pacciamatura','Coprire la terra con paglia o corteccia: trattiene l’umidità.'],['Consociazione','Coltivare vicine piante che si aiutano a vicenda.'],['Tessuto non tessuto','Telo leggero che protegge dal freddo lasciando passare luce e aria.'],['Carbone attivo','Carbone poroso che assorbe impurità; nel terrario limita muffe e odori.'],['Drenaggio','Strato di materiale grossolano che fa defluire l’acqua.']].map(([a,b])=>`<div><dt><b>${a}</b></dt><dd style="margin:2px 0 0">${b}</dd></div>`).join('')}</dl>`}
};

 <section class="card"><div class="row"><div class="grow"><h2>Dove comprare online</h2><p class="small muted">Link ai negozi per piante da terrario, muschio, collemboli, carnivore e piante grasse.</p></div><button class="btn soft" data-a="shops">Apri</button></div></section>`;
 o+=`<section class="card"><h2>Aggiungi a mano</h2><div class="row"><input type="text" id="sNew" placeholder="Es. vaso per la menta" aria-label="Nuovo articolo"><button class="btn primary" data-a="saddm">Aggiungi</button></div></section>`;
 if(!L.length)o+=`<section class="card"><p class="small muted">Nessuna lista ancora. Premi “Lista del terrario” o “Lista dell’orto”: l’app calcola tutto quello che serve dai tuoi progetti.</p></section>`;
 srcs.forEach(src=>{const it=L.filter(x=>x.src===src);const left=it.filter(x=>!x.done).length;
  o+=`<section class="card"><div class="row spread"><div class="grow"><h2>${esc(srcLabel(it[0]))}</h2><div class="tiny muted">${left?left+' da comprare':'Tutto comprato'} · ${it.length} articoli</div></div><button class="btn sm" data-a="scopy" data-src="${esc(src)}">Copia</button></div>`;
  GROUPS.forEach(g=>{const gi=it.filter(x=>x.g===g);if(!gi.length)return;o+=`<div class="eyebrow">${g==='Terrario'?'Contenitore e strati':g}</div><div class="list">${gi.map(itemRow).join('')}</div>`});
  o+=`<button class="btn sm danger" data-a="sdelsrc" data-src="${esc(src)}">Elimina questa lista</button></section>`});
 if(L.length)o+=`<section class="card"><div class="stack"><button class="btn block" data-a="scopy">Copia tutte le liste (per WhatsApp o Note)</button><button class="btn block" data-a="sclean">Togli gli articoli comprati</button><button class="btn danger block" data-a="sclear">Svuota tutto</button></div></section>`;
 return o;

function syncTerrSpesa(t,plan){const src='terr:'+t.id,name='Terrario: '+t.name;plan=plan||terrPlan(t);if(!plan.items.length){if(S.spesa.some(x=>x.src===src)){S.spesa=S.spesa.filter(x=>x.src!==src);save()}return[]}const mats=plan.mats;const cur=S.spesa.filter(x=>x.src===src);
 const sig=a=>a.map(m=>[m.g,m.t,m.q].join('|')).join('\n');
 if(sig(cur)!==sig(mats)||cur.some(x=>x.srcName!==name))addToSpesa(mats,src,name);
 return S.spesa.filter(x=>x.src===src)}
function addToSpesa(items,src,srcName){const old=S.spesa.filter(x=>x.src===src);const keep=S.spesa.filter(x=>x.src!==src);const n=items.map(m=>{const prev=old.find(x=>x.t===m.t);return{id:uid(),g:m.g,t:m.t,q:m.q,w:m.w||whereFor(m),done:prev?prev.done:false,src,srcName}});S.spesa=[...keep,...n];save();return n.length}

function icsEsc(s){return String(s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n')}
function fold(l){const out=[];while(l.length>72){out.push(l.slice(0,72));l=' '+l.slice(72)}out.push(l);return out.join('\r\n')}
function exportICS(all){const t=todayISO();const list=dedupe(S.tasks.filter(x=>!x.done&&x.date>=t&&(all||!x.exp)).sort((a,b)=>a.date.localeCompare(b.date)));if(!list.length){toast('Nessun promemoria da esportare');return}
 const stamp=new Date().toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Serra di Casa//IT','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:Serra di Casa'];
 list.forEach(x=>{L.push('BEGIN:VEVENT','UID:'+x.id+'@serradicasa','DTSTAMP:'+stamp,'DTSTART;VALUE=DATE:'+x.date.replace(/-/g,''),'DTEND;VALUE=DATE:'+addDays(x.date,1).replace(/-/g,''),fold('SUMMARY:'+icsEsc(x.title)),fold('DESCRIPTION:'+icsEsc(x.note||'')),'TRANSP:TRANSPARENT','BEGIN:VALARM','ACTION:DISPLAY',fold('DESCRIPTION:'+icsEsc(x.title)),'TRIGGER;RELATED=START:PT9H','END:VALARM','END:VEVENT')});
 L.push('END:VCALENDAR');const blob=new Blob([L.join('\r\n')+'\r\n'],{type:'text/calendar;charset=utf-8'});
 const groups=new Set(list.map(x=>x.group).filter(Boolean));S.tasks.forEach(x=>{if(list.includes(x)||(x.group&&groups.has(x.group)))x.exp=true});save();
 downloadBlob(blob,'serra-di-casa-promemoria.ics');toast(`${list.length} promemoria: conferma “Aggiungi tutti” nel Calendario`);render()}
function downloadBlob(blob,name){try{const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},4000)}catch(e){toast('Non riesco a creare il file qui: apri l’app dalla schermata Home')}}
function copyText(txt){const done=()=>toast('Copiato');try{navigator.clipboard.writeText(txt).then(done,()=>showCopy(txt))}catch(e){showCopy(txt)}}
function showCopy(txt){openSheet('Copia il testo',()=>`<p class="small muted">Tieni premuto sul testo, scegli “Seleziona tutto” e poi “Copia”.</p><textarea id="cpy" style="min-height:240px" readonly>${esc(txt)}</textarea>`);setTimeout(()=>{const t=$('#cpy');if(t){t.focus();t.select()}},50)}

function aiBody(){const a=ui.ai;const plants=a.ctx==='terr'?TPLANTS.map(p=>[p.id,p.name]):CROPS.map(c=>[c.id,c.name]);

 <label class="f">Quale pianta è<select id="aiplant" data-c="aiplant"><option value="">Non lo so / un’altra</option>${plants.map(([id,n])=>`<option value="${id}" ${a.plant===id?'selected':''}>${esc(n)}</option>`).join('')}</select></label>

 <ol class="steps"><li><div class="small">Scatta la foto da vicino, con luce naturale, mostrando bene le foglie colpite (anche il rovescio).</div></li><li><div class="small">Premi il pulsante qui sotto: la richiesta viene copiata e si apre Claude.</div></li><li><div class="small">In Claude tieni premuto nel campo di testo, scegli <b>Incolla</b>, allega la foto con il <b>+</b> e invia.</div></li></ol>

function resizeImg(file,max){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const img=new Image();img.onerror=rej;img.onload=()=>{const m=max||900,k=Math.min(1,m/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.72))};img.src=r.result};r.readAsDataURL(file)})}

/* Aggiornamento automatico: all'apertura e ogni volta che torni nell'app controlla se su GitHub c'è una versione nuova */
const APP_VERSION='2026-10-05.4';
let swReg=null,reloading=false;
async function checkUpdate(){
 try{if(swReg)swReg.update().catch(()=>{})}catch(e){}
 try{const r=await fetch('version.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)return;const v=(await r.json()).v;
  let tried=null;try{tried=sessionStorage.getItem(KEY+'-try')}catch(e){}
  if(v&&v!==APP_VERSION&&!reloading&&tried!==v){reloading=true;try{sessionStorage.setItem(KEY+'-try',v);sessionStorage.setItem(KEY+'-upd',v)}catch(e){}location.reload()}}catch(e){}
}
try{if('serviceWorker' in navigator&&location.protocol==='https:'&&!/claude\.(ai|site)|claudeusercontent/.test(location.hostname)){
 navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{swReg=r}).catch(()=>{});
 navigator.serviceWorker.addEventListener('controllerchange',()=>{if(reloading)return;reloading=true;location.reload()});
 checkUpdate();
 document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkUpdate()});
 window.addEventListener('pageshow',e=>{if(e.persisted)checkUpdate()});
}}catch(e){}
try{if(sessionStorage.getItem(KEY+'-upd')){sessionStorage.removeItem(KEY+'-upd');setTimeout(()=>toast('App aggiornata all’ultima versione'),400)}}catch(e){}
</script>
